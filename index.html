<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Certificados - Sicos Informática</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #5b21b6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .logo-container {
            position: absolute;
            top: 25px;
            left: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
        }

        .logo-container img {
            width: 120px;
            height: auto;
            display: block;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .logo-container img:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        .card-verifier {
            background-color: #4c1d95;
            border: 2px solid #7c3aed;
            border-radius: 12px;
            padding: 35px 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .card-verifier h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #f3e8ff;
        }

        .card-verifier p.subtitle {
            font-size: 0.95rem;
            color: #ddd6fe;
            margin-bottom: 25px;
        }

        .status-badge {
            background-color: #059669;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .student-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .student-dni {
            font-size: 1rem;
            color: #e9d5ff;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .course-title {
            font-size: 1.1rem;
            color: #c4b5fd;
            margin-bottom: 20px;
        }

        .details-grid {
            border-top: 1px solid #6d28d9;
            padding-top: 15px;
            display: flex;
            justify-content: space-around;
            font-size: 0.9rem;
            color: #ddd6fe;
        }

        /* Botón animado de descarga centrado debajo del cuadrado */
        .btn-download {
            margin-top: 25px;
            display: inline-block;
            padding: 12px 28px;
            background-color: #059669;
            color: #ffffff;
            font-weight: bold;
            font-size: 1rem;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.4);
            transition: transform 0.2s ease, background-color 0.2s ease;
            animation: pulse 2s infinite;
        }

        .btn-download:hover {
            background-color: #10b981;
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
        }

        /* Animación de palpitación sutil */
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6);
            }
            70% {
                box-shadow: 0 0 0 12px rgba(16, 185, 129, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        /* Copyright en la esquina inferior izquierda */
        .copyright {
            position: absolute;
            bottom: 20px;
            left: 25px;
            font-size: 0.8rem;
            color: #c4b5fd;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Logo de la empresa -->
        <a href="https://sicosinformatica.com.ar/" target="_blank" rel="noopener noreferrer">
            <img src="logo.png.png" alt="Logotipo Sicos Informática">
        </a>
        <!-- Imagen de inicio (png2) -->
        <a href="https://sicosinformatica.com.ar/" target="_blank" rel="noopener noreferrer">
            <img src="png2.png" alt="Inicio Sicos Informática">
        </a>
    </div>

    <div class="card-verifier">
        <h1>Verificación de Certificado</h1>
        <p class="subtitle">Sicos Informática — Documento Oficial</p>

        <span class="status-badge">✓ Certificado Válido</span>
        
        <div class="student-name">José Ángel Catalino Cantero</div>
        <div class="student-dni">DNI: 42983492</div>
        <div class="course-title">Curso de Reparación de PC</div>

        <div class="details-grid">
            <div><strong>Estado:</strong> Aprobado</div>
            <div><strong>Emisión:</strong> 2023</div>
        </div>
    </div>

    <!-- Botón animado descargable centrado -->
    <a href="certificado.pdf" download="Certificado_Jose_Cantero.pdf" class="btn-download">
        Descargar Certificado 📄
    </a>

    <!-- Texto de Copyright -->
    <div class="copyright">
        Copyright© 2026 - Sicos Informática - Todos los derechos reservados
    </div>

</body>
</html>
